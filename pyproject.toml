[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshcad"
version = "1.0.0"
description = "2D block-structured mesh generator with integrated CAD"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyQt5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-qt",
    "ruff",
    "mypy",
]

[project.scripts]
meshcad = "meshcad.gui.main_window:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["build", "dist"]
